# OCR Prompts
ocr_prompts:
  groq_vision: |
    You are an expert in reading historical Arabic manuscripts.
    Extract ALL Arabic text from this image with maximum accuracy.
    
    Instructions:
    1. Read the text carefully from right to left
    2. Preserve diacritics (harakat) if visible
    3. Maintain line breaks
    4. Do NOT add any explanations or comments
    5. If text is unclear, mark with [unclear]
    6. Return ONLY the extracted text
    
    This is a genealogical manuscript (عمود النسب).
    Pay special attention to names and lineages.

  gemini_vision: |
    Extract Arabic text from this manuscript image.
    This is a genealogical document with names and family lineages.
    Provide the complete text with high accuracy.
    Return only the text, no explanations.

# Analysis Prompts
analysis_prompts:
  text_correction: |
    You are an expert editor of classical Arabic manuscripts.
    
    Task: Correct OCR errors in the following Arabic text.
    
    Guidelines:
    1. Fix obvious OCR mistakes (misread letters, spacing issues)
    2. Preserve original meaning and style
    3. Do NOT modernize the language
    4. Keep genealogical chains intact (بن، ابن، etc.)
    5. Return ONLY the corrected text
    
    Text to correct:
    {text}

  word_explanation: |
    You are a specialist in classical Arabic and Islamic genealogy.
    
    Task: Extract and explain difficult words from this manuscript.
    
    For each difficult/archaic word, provide:
    1. الكلمة (The word)
    2. المعنى العام (General meaning)
    3. المعنى في السياق (Meaning in context)
    4. نوع الكلمة (Word type: name, title, place, etc.)
    
    Return as JSON array.
    
    Text:
    {text}

  summarization: |
    Summarize this Arabic genealogical manuscript.
    
    Include:
    1. الملخص العام (General summary)
    2. الشخصيات المذكورة (Mentioned personalities)
    3. الأنساب والعائلات (Lineages and families)
    4. السياق التاريخي (Historical context if available)
    5. المصادر والمراجع (Sources and references)
    
    Text:
    {text}

  entity_extraction: |
    Extract all named entities from this Arabic genealogical text.
    
    Categories:
    - الأشخاص (Persons): Full names with lineage
    - الأماكن (Places): Cities, regions, countries
    - التواريخ (Dates): Years, periods
    - الكتب والمصادر (Books and sources)
    - الألقاب (Titles): Scholarly, religious, political
    
    Return as structured JSON.
    
    Text:
    {text}

# Review Prompts
review_prompts:
  chunk_validation: |
    Validate and review this chunk of Arabic manuscript text.
    
    Chunk info: Pages {page_range}
    
    Tasks:
    1. Check for OCR errors
    2. Verify text coherence
    3. Ensure genealogical chains are complete
    4. Flag any unclear sections
    
    Return:
    - corrected_text: The corrected version
    - confidence_score: 0-1 (how confident you are)
    - issues: List of problems found
    - notes: Any observations
    
    Text:
    {text}

  chunk_merging: |
    Merge these consecutive chunks of Arabic manuscript text.
    
    Ensure:
    1. Smooth transitions between chunks
    2. No duplicate content
    3. Complete genealogical chains
    4. Consistent formatting
    
    Chunk 1 (Pages {pages_1}):
    {text_1}
    
    Chunk 2 (Pages {pages_2}):
    {text_2}
    
    Return the merged text.
