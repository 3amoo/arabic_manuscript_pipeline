# General Settings
general:
  project_name: "Arabic Manuscript Pipeline"
  version: "1.0.0"

# Input Settings
input:
  default_directory: "data/input"
  supported_formats:
  - ".pdf"
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".tiff"
  - ".tif"
  # Per-page check (pdf_text_extractor.py): if a PDF page already has a
  # usable embedded text layer (digitally-typeset page, or a prior OCR
  # pass with a correct ToUnicode map), main.py skips preprocessing +
  # layout detection + OCR entirely for that page and uses the embedded
  # text as-is - faster and no risk of new OCR errors on a page that
  # never needed OCR. Purely a per-page decision: a PDF that mixes a
  # typeset preface with a scanned manuscript body gets the fast path
  # only for the pages that actually qualify, no manual page-range
  # config needed. The usability check itself is deliberately
  # conservative (see pdf_text_extractor.py) - a broken/missing
  # ToUnicode CMap (common in scanned Arabic manuscript PDFs) is
  # rejected and that page falls back to the normal OCR path exactly as
  # before. Set enabled: false to force every PDF page through OCR
  # regardless (e.g. if you've confirmed a manuscript's embedded text
  # layer is garbage that somehow still passes the check).
  direct_text_extraction:
    enabled: true

# PDF Processing
pdf:
  # NOTE: this DPI is also what page_layout_detector.py / segment_text_rows.py's
  # pixel-based thresholds (line height, gutter width, dilation kernel
  # size, etc.) were tuned at. Raising it improves OCR sharpness but
  # requires re-calibrating those constants too - see main.py's
  # process_document() docstring. Left at 200 until that re-calibration
  # pass happens; do not raise this alone.
  dpi: 200
  page_range:

# Local image-enhancement pipeline (preprocessing.py), applied to every
# page BEFORE layout detection / segmentation / OCR. Order is fixed in
# code: deskew -> CLAHE -> denoise. See preprocessing.py's module
# docstring for why deskew must run first.
preprocessing:
  deskew:
    enabled: true
    max_angle: 5.0   # degrees; correction is clamped to this range
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  denoising:
    enabled: true
    method: "median"
    kernel_size: 3   # kept small on purpose - a larger kernel risks
                      # eroding thin diacritics (tashkeel)
  # 'thresholding' and 'sharpening' keys intentionally removed: neither
  # was ever implemented (there was no preprocessor.py, and
  # preprocessing.py does not read them - see its module docstring for
  # why). page_layout_detector.py / segment_text_rows.py already run
  # their own Otsu threshold at each detection stage; a separate global
  # threshold here would just be discarded and redone.

ocr:
  use_gpu: true
  min_confidence: 0.4
  # Only affects OCREngine.extract() (whole-page path), which the actual
  # pipeline in main.py does not call - main.py always goes through
  # extract_segment() per pre-cropped line. Kept for anyone using
  # OCREngine.extract() directly (e.g. a future whole-page fallback
  # path), but changing it has NO effect on a normal main.py run.
  text_det_limit_side_len: 1536
  # How many already-cropped line images main.py's extract_poetry_region()
  # / extract_prose_region() group into ONE PaddleOCR predict() call via
  # extract_segments_batch() (see ocr_engine.py's docstring), instead of
  # one predict() call per line. 16 is a conservative default for a small
  # (4GB) GPU like a GTX 1650 - raise it if VRAM headroom allows (fewer,
  # bigger calls = less per-call overhead), or lower it if a run OOMs on
  # pages with unusually wide verse-line crops.
  segment_batch_size: 16
  # SQLite result cache (ocr_cache.py) - a hash of each cropped line image
  # (plus the recognition model name above) is looked up before running
  # PaddleOCR on it. A hit reuses the exact prior result with no GPU call
  # at all, so a repeated/resumed run over pages already OCR'd once is
  # much cheaper. Safe by construction: recognition is deterministic for
  # a fixed model, and changing text_recognition_model_name automatically
  # starts a disjoint set of cache entries (see ocr_cache.py's module
  # docstring) rather than ever serving a stale result from an old model.
  caching:
    enabled: true
    db_path: "data/output/.cache/ocr_cache.sqlite3"
  # Page-confidence reprocess loop (AGENTS.md §4.10): a page whose
  # character-weighted confidence aggregates below `threshold` is OCR'd a
  # second time with DIFFERENT binarization settings (finer block + less
  # aggressive c) before shipping. Only the better-confidence pass wins;
  # its text and escalations are kept, the other pass is discarded.
  # `threshold` is on the PAGE scale (0-100), not the word/line scale
  # used by vision_fallback.should_escalate. The retry block/c values are
  # an "adjustment arm" for §4.2 and any change to them must be justified
  # by CER/WER measurement against ground truth.
  page_confidence_reprocess:
    enabled: true
    threshold: 50.0
    retry_block_size: 31
    retry_c: 5

analysis:
  llm_provider: "gemini"
  chunk_size: 10
  max_chunk_overlap: 2

# Output Settings
output:
  base_directory: "data/output"
  formats:
  - "txt"
  - "json"
  - "md"
  include_metadata: true
  cleanup_temp: true

# Optional line-detection backend (surya_line_detector.py + AGENTS.md §13
# Phase 2). ABSENT by default = the classical row-projection detector in
# segment_text_rows.py is used (the proven path). surya-ocr is now
# INSTALLED in the venv; to switch line-boundary detection to Surya's
# DetectionPredictor instead, set `line_detector: surya` and pick a
# device. This changes OCR behavior, so it must be validated with
# CER/WER against ground truth before it can be called an improvement
# (AGENTS.md §4.12 - the ground truth does not exist yet).
# layout_detection:
#   line_detector: "surya"   # uncomment to enable; anything else -> classical
#   surya:
#     device: "cuda"         # "cuda" | "cpu" | null (auto-detect)
#     confidence_threshold: 0.4

# Review Settings
review:
  enabled: true
  auto_merge_chunks: true
  validation_threshold: 0.85

# Logging
logging:
  level: "INFO"
  file: "data/logs/processing.log"
  max_size: "10MB"
  backup_count: 5

vision_fallback:
  enabled: true
  rotation_order:
  - gemini
  - gemini_2
  - groq
  - groq_2
  - sovereign
  - sovereign_2
  - openrouter
  confidence_threshold: 0.55
  max_calls: 3000
  # Ink-density gate threshold (FR-003): crops with ink ratio below this
  # value are blocked from Vision escalation. Default 0.02 (2%).
  # CALIBRATION NOTE (T015, 2026-09-10): measured 3,629 real crops across
  # all 113 pages — minimum ink ratio was 0.018 (1.8%), mean 0.166 (16.6%).
  # No crops fell below 0.02, so this threshold provides zero Vision-call
  # reduction on the current manuscript. The gate is a defensive check for
  # genuinely blank pages (scan errors, missing pages) in future manuscripts,
  # not a fix for this manuscript's noise pattern (watermarks/kashida, which
  # have high ink ratio but no readable text — a different failure mode).
  ink_density_threshold: 0.02
  # Persistent occurrence counter for the 'repeated_verbatim'
  # (hallucination) flag - see repeated_verbatim_tracker.py. Unlike the
  # old in-memory dict, this survives across runs so a phrase that keeps
  # being hallucinated over several days is caught (it was documented in
  # vision_escalations.txt appearing on pages 20-27 across separate runs
  # with a fresh dict each time, never flagged).
  repeated_verbatim_db: "data/output/.cache/repeated_verbatim.sqlite3"
  backends:
    gemini:
      model: gemini-3.6-flash
      api_key_env: GEMINI_API_KEY1
    gemini_2:
      model: gemini-3.6-flash
      api_key_env: GEMINI_API_KEY2
    groq:
      model: qwen/qwen3.6-27b
      api_key_env: GROQ_API_KEY1
    groq_2:
      model: qwen/qwen3.6-27b
      api_key_env: GROQ_API_KEY2
    openrouter:
      model: qwen/qwen2.5-vl-72b-instruct
      api_key_env: OPENROUTER_API_KEY
    sovereign:
      model: claude-sonnet-5
      api_key_env: SOVEREIGN_API_KEY1
    sovereign_2:
      model: claude-sonnet-5
      api_key_env: SOVEREIGN_API_KEY2
    cohere:
      model: c4ai-aya-vision-32b
      api_key_env: COHERE_API_KEY
    claude:
      model: claude-sonnet-5
      api_key_env: ANTHROPIC_API_KEY
    qwen_vl:
      # Local/free vision backend (zero API cost, no quota). Needs
      # Ollama running locally with a Qwen-VL model pulled, e.g.:
      #   ollama pull qwen2.5vl
      #   ollama run qwen2.5vl:7b
      # No api_key_env - Ollama ignores the key entirely.
      model: qwen2.5vl:7b
      # Optional override if Ollama listens elsewhere (not localhost):
      # base_url: "http://localhost:11434/v1"

text_correction:
  enabled: true
  rotation_order: [gemini, groq]
  max_calls: 500
  backends:
    gemini:
      model: gemini-flash-lite-latest
      api_key_env: GEMINI_API_KEY1
    groq:
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY1

# REVIEW-only morphological verifier (morphological_verifier.py +
# flag_suspicious_words.py -> output/<doc>/review/suspicious_words.jsonl).
# Not part of the main.py OCR path. camel-tools 1.6.0 + morphology-db-msa-r13
# are installed; `db_name` below is the packaging name inside camel_tools
# (the DB pip package is 'morphology-db-msa-r13', the DB name is
# 'calima-msa-r13').
# token_verification:
#   db_name: "calima-msa-r13"
#   max_candidates: 5