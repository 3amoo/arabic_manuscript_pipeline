# General Settings
general:
  project_name: "Arabic Manuscript Pipeline"
  version: "1.0.0"

# Input Settings
input:
  default_directory: "input"
  supported_formats:
  - ".pdf"
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".tiff"
  - ".tif"
  # Per-page check (pdf_text_extractor.py): if a PDF page already has a
  # usable embedded text layer (digitally-typeset page, or a prior OCR
  # pass with a correct ToUnicode map), main.py skips preprocessing +
  # layout detection + OCR entirely for that page and uses the embedded
  # text as-is - faster and no risk of new OCR errors on a page that
  # never needed OCR. Purely a per-page decision: a PDF that mixes a
  # typeset preface with a scanned manuscript body gets the fast path
  # only for the pages that actually qualify, no manual page-range
  # config needed. The usability check itself is deliberately
  # conservative (see pdf_text_extractor.py) - a broken/missing
  # ToUnicode CMap (common in scanned Arabic manuscript PDFs) is
  # rejected and that page falls back to the normal OCR path exactly as
  # before. Set enabled: false to force every PDF page through OCR
  # regardless (e.g. if you've confirmed a manuscript's embedded text
  # layer is garbage that somehow still passes the check).
  direct_text_extraction:
    enabled: true

# PDF Processing
pdf:
  # NOTE: this DPI is also what page_layout_detector.py / segment_text_rows.py's
  # pixel-based thresholds (line height, gutter width, dilation kernel
  # size, etc.) were tuned at. Raising it improves OCR sharpness but
  # requires re-calibrating those constants too - see main.py's
  # process_document() docstring. Left at 200 until that re-calibration
  # pass happens; do not raise this alone.
  dpi: 200
  page_range:

# Local image-enhancement pipeline (preprocessing.py), applied to every
# page BEFORE layout detection / segmentation / OCR. Order is fixed in
# code: deskew -> CLAHE -> denoise. See preprocessing.py's module
# docstring for why deskew must run first.
preprocessing:
  deskew:
    enabled: true
    max_angle: 5.0   # degrees; correction is clamped to this range
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  denoising:
    enabled: true
    method: "median"
    kernel_size: 3   # kept small on purpose - a larger kernel risks
                      # eroding thin diacritics (tashkeel)
  # 'thresholding' and 'sharpening' keys intentionally removed: neither
  # was ever implemented (there was no preprocessor.py, and
  # preprocessing.py does not read them - see its module docstring for
  # why). page_layout_detector.py / segment_text_rows.py already run
  # their own Otsu threshold at each detection stage; a separate global
  # threshold here would just be discarded and redone.

ocr:
  use_gpu: true
  min_confidence: 0.4
  # Only affects OCREngine.extract() (whole-page path), which the actual
  # pipeline in main.py does not call - main.py always goes through
  # extract_segment() per pre-cropped line. Kept for anyone using
  # OCREngine.extract() directly (e.g. a future whole-page fallback
  # path), but changing it has NO effect on a normal main.py run.
  text_det_limit_side_len: 1536
  # How many already-cropped line images main.py's extract_poetry_region()
  # / extract_prose_region() group into ONE PaddleOCR predict() call via
  # extract_segments_batch() (see ocr_engine.py's docstring), instead of
  # one predict() call per line. 16 is a conservative default for a small
  # (4GB) GPU like a GTX 1650 - raise it if VRAM headroom allows (fewer,
  # bigger calls = less per-call overhead), or lower it if a run OOMs on
  # pages with unusually wide verse-line crops.
  segment_batch_size: 16
  # SQLite result cache (ocr_cache.py) - a hash of each cropped line image
  # (plus the recognition model name above) is looked up before running
  # PaddleOCR on it. A hit reuses the exact prior result with no GPU call
  # at all, so a repeated/resumed run over pages already OCR'd once is
  # much cheaper. Safe by construction: recognition is deterministic for
  # a fixed model, and changing text_recognition_model_name automatically
  # starts a disjoint set of cache entries (see ocr_cache.py's module
  # docstring) rather than ever serving a stale result from an old model.
  caching:
    enabled: true
    db_path: "output/.cache/ocr_cache.sqlite3"

analysis:
  llm_provider: "gemini"
  chunk_size: 10
  max_chunk_overlap: 2

# Output Settings
output:
  base_directory: "output"
  formats:
  - "txt"
  - "json"
  - "md"
  include_metadata: true
  cleanup_temp: true

# Review Settings
review:
  enabled: true
  auto_merge_chunks: true
  validation_threshold: 0.85

# Logging
logging:
  level: "INFO"
  file: "logs/processing.log"
  max_size: "10MB"
  backup_count: 5

vision_fallback:
  enabled: true
  rotation_order:
  - gemini
  - gemini_2
  - groq
  - groq_2
  - sovereign
  - sovereign_2
  - openrouter
  confidence_threshold: 0.55
  max_calls: 3000
  backends:
    gemini:
      model: gemini-3.6-flash
      api_key_env: GEMINI_API_KEY1
    gemini_2:
      model: gemini-3.6-flash
      api_key_env: GEMINI_API_KEY2
    groq:
      model: qwen/qwen3.6-27b
      api_key_env: GROQ_API_KEY1
    groq_2:
      model: qwen/qwen3.6-27b
      api_key_env: GROQ_API_KEY2
    openrouter:
      model: qwen/qwen2.5-vl-72b-instruct
      api_key_env: OPENROUTER_API_KEY
    sovereign:
      model: claude-sonnet-5
      api_key_env: SOVEREIGN_API_KEY1
    sovereign_2:
      model: claude-sonnet-5
      api_key_env: SOVEREIGN_API_KEY2
    cohere:
      model: c4ai-aya-vision-32b
      api_key_env: COHERE_API_KEY
    claude:
      model: claude-sonnet-5
      api_key_env: ANTHROPIC_API_KEY

text_correction:
  enabled: true
  rotation_order: [gemini, groq]
  max_calls: 500
  backends:
    gemini:
      model: gemini-flash-lite-latest
      api_key_env: GEMINI_API_KEY1
    groq:
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY1